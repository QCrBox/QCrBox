services:
  nosphera2-ptb:
    image: "qcrbox/nosphera2-ptb:${QCRBOX_DOCKER_TAG:?Must set env var QCRBOX_DOCKER_TAG}"
    build:
      context: services/applications/nosphera2-ptb/
      args:
        QCRBOX_DOCKER_TAG: ${QCRBOX_DOCKER_TAG:?Must set env var QCRBOX_DOCKER_TAG}
    depends_on:
      qcrbox-registry:
        condition: service_healthy
    volumes:
      - ${QCRBOX_SHARED_FILES_DIR_HOST_PATH:?Must set env var QCRBOX_SHARED_FILES_DIR_HOST_PATH}:${QCRBOX_SHARED_FILES_DIR_CONTAINER_PATH:?Must set env var QCRBOX_SHARED_FILES_DIR_CONTAINER_PATH}
    networks:
      - qcrbox-net
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.to-path-prefix.rule: Path(`/gui/nosphera2-ptb`)
      traefik.http.routers.to-path-prefix.middlewares: redirect-gui-path
      traefik.http.routers.to-path-prefix.service: nosphera2-ptb-service
      traefik.http.middlewares.redirect-gui-path.redirectregex.regex: ^http://(.+)/gui/nosphera2-ptb(/?)$$
      traefik.http.middlewares.redirect-gui-path.redirectregex.replacement: http://nosphera2-ptb.gui.$$1/vnc.html?path=vnc&autoconnect=true&resize=remote&reconnect=true&show_dot=true

      traefik.http.routers.to-subdomain.rule: HostRegexp(`^nosphera2-ptb\.gui\..+$$`)
      traefik.http.routers.to-subdomain.middlewares: redirect-gui-subdomain
      traefik.http.routers.to-subdomain.service: nosphera2-ptb-service
      traefik.http.middlewares.redirect-gui-subdomain.redirectregex.regex: ^http://nosphera2-ptb\.gui\.([^/]+)(/?)$$
      traefik.http.middlewares.redirect-gui-subdomain.redirectregex.replacement: http://nosphera2-ptb.gui.$$1/vnc.html?path=vnc&autoconnect=true&resize=remote&reconnect=true&show_dot=true

      traefik.http.services.nosphera2-ptb-service.loadbalancer.server.scheme: http
      traefik.http.services.nosphera2-ptb-service.loadbalancer.server.port: 8080
