name: "QCrBox CI"

# Controls when the workflow will run
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      # Checks out the  repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies

      - name: Install dependencies
        run: |
          pip install --upgrade uv
          uv pip install --system -r ./pyqcrbox/requirements-docs.txt
          uv pip install --system pyqcrbox@./pyqcrbox

      - name: Build the documentation
        run: mkdocs build

#      - name: Create .tar.gz archive containing the docs build
#        run: cd .build/docs_site/ && tar -czvf ../qcrbox_docs.tar.gz .
#
      - name: Upload docs build output as GitHub pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/docs_site/

  deploy_docs:
    if: github.event_name == 'push'
    needs: build_docs

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner and deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or the latest "vX.X.X" version tag for this action

  # ruff:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Print ruff version
  #       uses: chartboost/ruff-action@v1
  #       with:
  #         args: --version
  #     - uses: chartboost/ruff-action@v1
  #       with:
  #         args: check --config pyqcrbox/pyproject.toml
  #     - uses: chartboost/ruff-action@v1
  #       with:
  #         args: format --diff --config pyqcrbox/pyproject.toml

  robot_acceptance_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # caching pip dependencies

      - name: Install Python dependencies for CLI
        run: |
          pip install --upgrade uv
          uv pip install --system -r ./pyqcrbox/requirements-dev.txt
          uv pip install --system pyqcrbox@./pyqcrbox

      - name: Clean up any existing containers
        run: |
          docker container prune -f
          docker network prune -f

      - name: Bring up QCrBox registry and applications
        run: |
          qcb up --test-only

      - name: Wait for QCrBox registry to be ready
        run: |
          set -a
          source .env.test
          set +a
          for i in {1..30}; do
            if curl -s ${QCRBOX_BIND_ADDRESS}:${QCRBOX_REGISTRY_PORT}/api/healthz; then
              exit 0
            fi
            echo "Waiting for registry to be ready... ($i/30)"
            sleep 10
          done
          echo "Registry is not available"
          exit 1

      - name: Wait for applications to be registered
        run: |
          set -a
          source .env.test
          set +a
          sleep 30
          curl -s ${QCRBOX_BIND_ADDRESS}:${QCRBOX_REGISTRY_PORT}/api/applications

      - name: Run Robot Framework test suites
        run: |
          set -a
          source .env.test
          set +a
          cd ./pyqcrbox/robot_tests

          echo "Running API Endpoints suite"
          robot api_endpoints.robot

      - name: Clean-up QCrBox
        if: always()
        run: |
          qcb down || true
          docker container prune -f
          docker network prune -f
